<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f4f4">
    <meta name="description" content="Gabrielle Essence Eau De Parfum — product details.">
    <title>Gabrielle Essence Eau De Parfum</title>

    <link rel="preload" href="assets/fonts/fraunces-700.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/montserrat-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main class="page" id="pageContent">
        <button type="button" class="trigger-button" id="popupOpen" aria-haspopup="dialog" aria-controls="productPopup" aria-expanded="false">
            <svg class="trigger-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>View product</span>
        </button>
    </main>

    <div class="popup" id="productPopup" role="dialog" aria-modal="true" aria-labelledby="productTitle" aria-describedby="productDescription" aria-hidden="false">
        <div class="popup__overlay" data-popup-close></div>

        <article class="product-card" id="productCard" aria-busy="true">
            <button type="button" class="popup__close" data-popup-close aria-label="Close product details">
                <span aria-hidden="true">&times;</span>
            </button>

            <div class="product-card__media">
                <img id="productImage"
                     src="assets/swappy-20261029-151855.png"
                     alt="Gabrielle Essence Eau De Parfum bottle"
                     width="400"
                     height="600"
                     decoding="async">
            </div>

            <div class="product-card__body">
                <p class="product-category" id="productCategory">Product</p>
                <h1 class="product-title" id="productTitle">Loading product&hellip;</h1>
                <p class="product-description" id="productDescription">Fetching the latest product details&hellip;</p>

                <div class="product-price" id="productPriceRow">
                    <span class="product-price__current" id="productPrice">&mdash;</span>
                    <span class="product-price__compare" id="productComparePrice" hidden></span>
                </div>

                <button type="button" class="add-to-cart" id="addToCart" disabled>
                    <svg class="add-to-cart__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="addToCartLabel">Add to Cart</span>
                </button>

                <button type="button" class="retry-button" id="retryButton" hidden>Try again</button>
            </div>
        </article>
    </div>

    <script src="api/api.js"></script>
    <script src="script/app.js"></script>
</body>
</html>
